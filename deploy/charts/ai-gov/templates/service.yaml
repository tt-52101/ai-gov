apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gov.fullname" . }}
  labels:
    {{- include "ai-gov.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: http-api
      protocol: TCP
      name: http-api
    - port: {{ .Values.service.uiPort }}
      targetPort: http-ui
      protocol: TCP
      name: http-ui
  selector:
    {{- include "ai-gov.selectorLabels" . | nindent 4 }}